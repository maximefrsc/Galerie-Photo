security:
    # Comment le mot de passe est chiffré
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Où Symfony va chercher les utilisateurs : table User, champ email
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login      # page affichée en cas d'erreur
                check_path: app_login      # URL où le formulaire est envoyé (POST)
                username_parameter: _username   # nom du champ e-mail
                password_parameter: _password   # nom du champ mot de passe
                enable_csrf: true          # protection contre les faux formulaires
                default_target_path: app_home
            logout:
                path: app_logout
                target: app_home

    access_control:
        # Pour l'instant tout est public
